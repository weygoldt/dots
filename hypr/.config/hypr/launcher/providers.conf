# sway-launcher-desktop sources (PROVIDERS_FILE, set by scripts/launcher).
# Only installed apps; the default "every command on PATH" source is left out.
# Typing a command and pressing Enter still runs it.
[desktop]
list_cmd=$HOME/.config/hypr/scripts/launcher-apps
preview_cmd=/usr/bin/sway-launcher-desktop describe-desktop "{1}"
launch_cmd=/usr/bin/sway-launcher-desktop run-desktop '{1}' {2}
purge_cmd=test -f '{1}' || exit 43
