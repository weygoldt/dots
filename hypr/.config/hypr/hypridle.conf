# hypridle: started from hyprland.lua (autostart).
#   4 min  dim the backlight (laptops)
#   5 min  lock; moving the mouse within 5 s unlocks again without a password
#   5.5    screens off
#  15 min  suspend, only on battery (scripts/idle-suspend)
# Video players and browsers playing media hold an idle inhibitor, so none of
# this happens during a film.

general {
    lock_cmd = ~/.config/hypr/scripts/lock
    before_sleep_cmd = loginctl lock-session # lid closed / suspend: lock first
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = brillo -O && brillo -u 400000 -S 10 # save, then fade to 10 %
    on-resume = brillo -I -u 150000                  # back to the saved level
}

listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/lock --grace 5
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle-suspend
}
