# hyprlock: started through scripts/lock, which writes the sourced theme
# (current wallpaper + the bar's palette) right before locking.
source = ~/.cache/hyprlock/theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, decel
    animation = fadeOut, 1, 4, decel
    animation = inputFieldDots, 1, 2, decel
}

background {
    monitor =
    path = $wallpaper
    color = $base # when there is no wallpaper
    blur_size = 8
    blur_passes = 3
    noise = 0.01
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(ffffffee)
    font_size = 120
    font_family = Inter Display ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $accent
    font_size = 20
    font_family = Inter Display SemiBold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 6 # same as windows, waybar pills and wlogout cards
    outline_thickness = 2
    outer_color = $accent
    inner_color = $base_a
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    check_color = $warn
    fail_color = $love
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">   $USER</span>
    fail_text = <b>$FAIL</b> ($ATTEMPTS)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000055)
    position = 0, -40
    halign = center
    valign = center
}

# Battery (empty on a desktop)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockinfo
    color = rgba(ffffffaa)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
