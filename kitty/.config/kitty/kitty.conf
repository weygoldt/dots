include themes/rose-pine.conf
window_padding_width 10
enabled_layouts splits

font_family      JetBrainsMono
bold_font        auto
italic_font      auto
bold_italic_font auto
modify_font cell_height 110%
font_size 9.0

allow_remote_control socket-only
listen_on unix:/tmp/kitty
confirm_os_window_close 0

# Hyprland manages window sizes; restoring a saved (maximized) state
# made every new kitty window, incl. the launcher, open maximized.
remember_window_size no

clipboard_control write-clipboard write-primary read-clipboard read-primary no-append
