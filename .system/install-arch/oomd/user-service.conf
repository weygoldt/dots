# Installed as /etc/systemd/system/user@.service.d/10-oomd.conf
# Kill the app in the user session whose memory pressure stays above 50% for
# 30s (oomd's default duration), before the desktop locks up. Pressure is not
# RAM usage: it is the share of time tasks stall waiting for memory (PSI), so
# 50% means the session is already thrashing, however full RAM is.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
