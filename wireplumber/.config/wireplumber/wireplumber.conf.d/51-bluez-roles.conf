# Bluetooth: only act as the computer side (audio gateway) for headsets.
# The default roles also include hfp_hf / hsp_hs (the laptop pretending to be
# a headset for a phone), which made bluetoothd look for a "Hands-Free Voice
# gateway" on every connected headset once a minute and log an error each time.
# Headset microphones keep working: that is hfp_ag / hsp_ag.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_ag hfp_ag ]
}
